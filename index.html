    <!-- Synchronous URL injector for active host (Dev / Shared / Live Domain) -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var absoluteImg = origin + '/og-image.jpg';
          
          // Update all og:image and twitter:image tags dynamically to match current hostname
          var images = document.querySelectorAll('meta[property^="og:image"], meta[name^="twitter:image"], meta[name="image"]');
          images.forEach(function(el) {
            if (el.hasAttribute('content')) {
              el.setAttribute('content', absoluteImg);
            }
          });

          var linkImgs = document.querySelectorAll('link[rel="image_src"]');
          linkImgs.forEach(function(el) {
            el.setAttribute('href', absoluteImg);
          });

          var oembedLink = document.querySelector('link[type="application/json+oembed"]');
          if (oembedLink) {
            oembedLink.setAttribute('href', origin + '/oembed.json');
          }

          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) {
            ogUrl.setAttribute('content', origin + '/');
          }
        } catch(e) {}
      })();
    </script>
