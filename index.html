    <!-- Dynamic absolute URL injector for social preview crawlers -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var ogImg = document.querySelector('meta[property="og:image"]');
          var twImg = document.querySelector('meta[name="twitter:image"]');
          var ogUrl = document.querySelector('meta[property="og:url"]');
          
          if (ogImg && !ogImg.content.startsWith('http')) {
            ogImg.content = origin + '/og-image.jpg';
          }
          if (twImg && !twImg.content.startsWith('http')) {
            twImg.content = origin + '/og-image.jpg';
          }
          if (!ogUrl) {
            var metaUrl = document.createElement('meta');
            metaUrl.setAttribute('property', 'og:url');
            metaUrl.setAttribute('content', origin);
            document.head.appendChild(metaUrl);
          }
        } catch(e) {}
      })();
    </script>
